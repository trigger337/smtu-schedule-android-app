plugins {
    id 'com.android.application'
}

// Optional release signing: a keystore.properties in the project root with
//   storeFile=/absolute/or/relative/path.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// CI writes this file from protected variables; without it, release builds
// fall back to the debug key — fine locally, but only the CI-signed APKs
// share one stable signature that installs over previous releases.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
// GitLab releases API used by the in-app update check; override with -PupdateApi=
def updateApi = (project.findProperty("updateApi")
        ?: "https://gitlab.com/api/v4/projects/trigger337%2Fsmtu-schedule-android-app/releases").toString()

android {
    namespace 'com.korabel.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "com.korabel.schedule"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.3.0"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField "String", "UPDATE_API", "\"${updateApi}\""
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd')}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Distinct, versioned APK file names: smtu-schedule-v1.3.0.apk and
    // smtu-schedule-v1.3.0-debug.apk instead of app-release/app-debug.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = variant.buildType.name == "release"
                    ? "smtu-schedule-v${variant.versionName}.apk"
                    : "smtu-schedule-v${variant.versionName}-debug.apk"
        }
    }
}

// intentionally no dependencies: built-in android.* APIs only, keeps the APK tiny

# CI: debug APK on main pushes; on vX.Y.Z tags build release+debug and
# publish both APKs as generic packages (app_release/app_debug) with the
# versioned file names. The GitLab release itself is created manually.
# Uses only CI_JOB_TOKEN — no PAT or CI variables.

stages: [build, publish]

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  CLT: "11076708"   # cmdline-tools build id

# Plain JDK image + scripted cmdline-tools install: no dependency on
# third-party Android images and their (drifting) SDK levels.
.setup_sdk: &setup_sdk
  - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip > /dev/null
  - if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      mkdir -p "$ANDROID_HOME/cmdline-tools" &&
      curl -sSLo /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CLT}_latest.zip" &&
      unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" &&
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest";
    fi
  - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
  - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

.gradle_cache: &gradle_cache
  cache:
    key: android-sdk-34-gradle
    paths:
      - .android-sdk/
      - .gradle/caches/
      - .gradle/wrapper/

build_debug:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  <<: *gradle_cache
  before_script: *setup_sdk
  script:
    - ./gradlew --quiet assembleDebug
  artifacts:
    name: "app-debug-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - app/build/outputs/apk/debug/smtu-schedule-v*-debug.apk

build_release:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  rules:
    - if: $CI_COMMIT_TAG
  <<: *gradle_cache
  before_script: *setup_sdk
  script:
    # Signing key comes from CI variables (Settings → CI/CD → Variables):
    #   KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD,
    #   KEY_ALIAS, KEY_PASSWORD — all masked+protected. Without them the
    #   release build falls back to the debug key.
    - if [ -n "$KEYSTORE_BASE64" ]; then
        echo "$KEYSTORE_BASE64" | base64 -d > release.jks &&
        printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties &&
        sha256sum release.jks &&
        keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null &&
        echo "keystore verified";
      fi
    - ./gradlew --quiet assembleRelease assembleDebug
  artifacts:
    name: "app-$CI_COMMIT_TAG"
    expire_in: never
    paths:
      - app/build/outputs/apk/release/smtu-schedule-v*.apk
      - app/build/outputs/apk/debug/smtu-schedule-v*-debug.apk

publish_packages:
  stage: publish
  image: curlimages/curl:8.10.1
  rules:
    - if: $CI_COMMIT_TAG
  needs: [build_release]
  script:
    - REL_APK=$(ls app/build/outputs/apk/release/smtu-schedule-v*.apk)
    - DBG_APK=$(ls app/build/outputs/apk/debug/smtu-schedule-v*-debug.apk)
    # Release APK -> package app_release v<tag>
    - >
      curl --fail --silent --show-error
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "${REL_APK}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/app_release/${CI_COMMIT_TAG}/$(basename ${REL_APK})"
    # Debug APK -> package app_debug v<tag>
    - >
      curl --fail --silent --show-error
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "${DBG_APK}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/app_debug/${CI_COMMIT_TAG}/$(basename ${DBG_APK})"
